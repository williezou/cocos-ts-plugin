name: Publish

# 手动触发：先确认 package.json version 是 registry 上没有的新版本。
# 认证走 npm Trusted Publishing（OIDC），不配置任何 token。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 才支持 trusted publishing 的 OIDC 交换（node 22 自带的 10.x 只会签 provenance）
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
